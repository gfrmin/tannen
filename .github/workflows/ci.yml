# CI mirrors the local gate exactly: `make verify` runs the three governance checks,
# pytest, and import-linter (kernel no-IO / no-cross-repo contracts, declared at
# Session 0 and trivially satisfied until M0).
name: ci
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: make verify
