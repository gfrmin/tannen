# Decision record — validated against governance/schemas/decision-record.schema.json.
id: D0041
title: The evidence stream is a store at evidence/, kept out of git; jsonschema becomes a runtime dependency
tier: A
date: "2026-08-24"
decision: >-
  Evidence records live in an ordinary tannen Store rooted at `evidence/` (override
  with TANNEN_EVIDENCE_ROOT; TANNEN_NO_EVIDENCE=1 switches emission off), so the
  evidence stream inherits write-once, append-only and verify-on-read for free.
  `evidence/` is gitignored: the stream is regenerated by running the laws, and
  committing it would put unbounded, undeletable data in git — undeletable because the
  store has no delete, which is the point. Store gains one read-only method, iter_refs,
  so the report can read its own evidence back; it is not a mutation surface.
  jsonschema moves from a dev dependency to a runtime dependency because the emitter
  VALIDATES against the frozen evidence-record schema before anything reaches disk: an
  invalid record never exists, and the schema is consumed rather than restated in
  Python.
rationale: >-
  BRIEF §2 forbids a second normative home for one shape; a hand-rolled validator here
  would be exactly that, and would drift from the frozen schema the moment either
  moved. On retention: BRIEF §7 wants the evidence stream for a future governor, and
  M4 gives it a durable home in R2 — until then, reproducible-on-demand beats
  irreversibly-accumulating-in-git.
reversibility: >-
  Committing the stream later is one .gitignore line plus a decision; nothing about the
  record format or the store layout changes. Dropping jsonschema would mean restating
  the schema, which the brief forbids.
status: accepted
bindings:
  - type: config
    target: "pyproject.toml#project.dependencies"
    detail: jsonschema is a runtime dependency of the emitter, not a dev convenience
  - type: pytest
    target: "tests/test_laws_runner.py::test_an_invalid_record_never_reaches_disk"
    detail: schema violation raises and the store stays empty
  - type: file
    target: .gitignore
    detail: evidence/ is excluded; the stream is regenerated, never deleted
links:
  - "BRIEF.md P6, §7"
  - "docs/specs/m0.md §3, §6"
