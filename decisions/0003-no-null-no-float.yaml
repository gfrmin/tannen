# Decision record — validated against governance/schemas/decision-record.schema.json.
id: D0003
title: No NULLs; no unpriced floats; no hidden clock
tier: A
date: "2026-08-24"
decision: >-
  Optionality is Option[T], never NULL. Bare floats are rejected in keys by the
  canonical encoding; Lossy(f, grid) is the only door, priced and visible. now() does
  not exist in the kernel namespace; the Clock oracle is the only source of time.
rationale: >-
  Pre-decided as principle P7 and BRIEF §5.7–§5.8, listed in §9 as never-ask-again;
  adopts the exactness-and-the-door concept (proplang KERNEL.md, pinned in
  concepts/exactness-and-the-door.yaml).
reversibility: >-
  Admitting NULLs or bare floats later would change key identity for affected
  pipelines; effectively irreversible without a full re-key, which is the point.
status: accepted
bindings:
  - type: pytest
    target: "tests/laws/m0/test_l0_encoding.py::test_l0_3_door_refuses_by_name"
    detail: >-
      Bare floats, NaN/Inf, bytes, tuples, non-str keys and the reserved tag key are all
      refused by name at the encoder. No float is encodable at M0 at all; Lossy(f, grid)
      is the declared door and arrives with the Rel layer at M1.
  - type: config
    target: "pyproject.toml#tool.importlinter.contracts"
    detail: >-
      The kernel-no-clock contract (added at M0, D0042) is the mechanical form of "now()
      does not exist in the kernel namespace": tannen.kernel may not import time,
      datetime, calendar, zoneinfo, random, secrets or uuid, so a hidden clock cannot be
      reached from the pure core at all.
links:
  - "BRIEF.md P7, §5.7, §5.8, §9"
  - "concepts/exactness-and-the-door.yaml"
