# Decision record — validated against governance/schemas/decision-record.schema.json.
id: D0001
title: Canonical encoding is canonical JSON
tier: A
date: "2026-08-24"
decision: >-
  The canonical encoding for all content addressing is canonical JSON: UTF-8, NFC,
  sorted keys, integers exact, decimals as tagged strings, no untagged floats —
  following the production canonical_json precedent, golden-tested across interpreters.
  CBOR is a benchmark-gated future migration, not a discussion.
rationale: >-
  Pre-decided in BRIEF §4 ("DECIDED") and listed in §9 as never-ask-again. Recorded as
  data so the M0 encoding suite has a record to bind to and the digest can show the
  pre-decisions alongside everything else.
reversibility: >-
  Migration to CBOR (or anything else) re-keys every content address in the store;
  gated on benchmarks post-M5, never on taste.
status: accepted
bindings:
  - type: pytest
    target: tests/laws/m0/test_l0_encoding.py
    detail: >-
      The M0 encoding law suite the Session-0 record promised this would bind to:
      L0.1 determinism, L0.2 goldens, L0.3 the door, L0.4 round-trip, L0.8 a fresh
      interpreter with a randomised hash seed reproducing every golden byte-identically.
  - type: manifest
    target: tests/laws/m0/golden-vectors.json
    detail: the frozen golden corpus; a behaviour change without a descriptor bump fails on it
links:
  - "BRIEF.md §4, §9"
