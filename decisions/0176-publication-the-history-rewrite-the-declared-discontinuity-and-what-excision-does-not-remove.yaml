# Decision record — validated against governance/schemas/decision-record.schema.json.
id: D0176
title: "Publication executes as a history rewrite, because D0115's mechanism (a) redacts nothing when the snapshots are in the root commit — the receipt chain's no-rewrite guarantee is spent once, declared rather than repaired, and the citations survive the excision"
tier: C
date: "2026-09-06"
risk_flags: ["public-surface", "governance-paths"]
decision: >-
  D0115 is already owner-signed and `accepted` — flipped from `blocked-on-owner` at the M1
  sitting (`65b68a3`) and re-verified today, `Good "tannen-decision" signature for
  owner@tannen`. This record is not a second authorisation. It is the execution, the two
  things the execution turns out to cost that D0115 did not price, and the one question
  D0115 never asked.
  .
  OWNER RULINGS TAKEN 2026-09-06, in conversation, and queued here for signature the way
  D0115 itself was: (1) excise all 12 sibling snapshot files from history, not merely from
  the published tree; (2) licence the result Apache-2.0, superseding the MIT/CC-BY-SA-4.0
  split in `policy.yaml licence_defaults` — which that file already says is a default and
  not a publication decision.
  .
  === WHY MECHANISM (a) IS NOT A REDACTION, MEASURED ===
  .
  D0115 recommends keeping the snapshots and excluding them from the published tree.
  `concepts/snapshots/**` entered at the ROOT COMMIT `5c3a474` and has been touched in
  exactly one commit in the repository's life, so all 594 lines sit in the tree of every
  one of the 77 commits across all five branches. Deleting them at HEAD leaves them one
  `git show 5c3a474` away. And the history is what gets published: `.github/workflows/
  ci.yml` pins `fetch-depth: 0` because the receipt chain asserts ancestry between recorded
  HEADs and the tag set is part of the custody floor. Mechanism (a) is still needed — it is
  what lets the registry verify once the bytes are gone — but it is the CONSEQUENCE of an
  excision, never a substitute for one.
  .
  === WHAT THE REWRITE COSTS, REHEARSED RATHER THAN ASSERTED ===
  .
  `docs/proposals/2026-09-06-publication/rehearse_rewrite.sh`, 14 steps, in a disposable
  clone; the source repository was never written to. 77 commits in, 77 out, none dropped, a
  complete 77-pair `commit-map` with zero null entries. The 12 files are absent from every
  commit of every ref; `concepts/snapshots/semiring-relations/` — this project's excerpt of
  its own BRIEF — survives, which keeps `check_concepts.py`'s byte-verifying path
  non-vacuous in the published tree rather than leaving it a branch nothing takes.
  .
  ALL EIGHT TAGS: `object CHANGED / signature BROKEN`, measured, every one. That includes
  `brief-freeze`, whose TAG OBJECT hash `c219e63819beb4052b326e47b9cbd5d208779cda` is
  pinned at `governance/tag-roles.yaml#trust_root.object` — the file that calls re-issuing
  it "the one act that would otherwise redefine every other check in the custody floor",
  and which `check_tag_signers.py` exists to detect. This plan performs that act
  deliberately, under signature, with the old value preserved here. Re-creation works: the
  four builder tags were re-signed with the real builder key at their ORIGINAL tagger dates
  via `GIT_COMMITTER_DATE` and all four verify with dates unchanged, so `bless_epoch` and
  D0036's delegation-precedes-signature ordering are undisturbed.
  .
  === THE RECEIPTS ARE NOT RE-SIGNED, AND THAT IS THE DESIGN ===
  .
  A rewrite kills all five: `check_receipts.py` runs `cat-file -e` on each recorded HEAD and
  every one becomes a non-commit. The obvious repair — edit each receipt to carry the new
  SHA and re-sign — fabricates an attestation of a moment nobody attested to, which is the
  precise thing the chain exists to prevent. Refused.
  .
  Instead the five receipts stay BYTE-IDENTICAL and the rewrite declares itself:
  `receipts/REWRITE-<date>.md`, owner-signed under its own namespace `tannen-rewrite`
  (distinct from `tannen-receipt` so neither signature can be replayed as the other),
  carrying the COMPLETE old->new map. `check_receipts.py` resolves each recorded HEAD
  through the map before looking it up. The chain then verifies end to end through a
  discontinuity that is itself signed, dated and public — which is strictly more than an
  un-rewritten history proves about itself.
  .
  Measured: against the rewritten history the shipped guard reports five "the history the
  owner attested to is gone" failures; with the patch and a signed attestation all five
  clear, with no receipt or receipt signature touched. Three negative controls, each
  watched going red per D0111/D0116 — attestation removed (the five failures return);
  attestation present but unsigned ("unsigned, it is the rewriting party vouching for
  itself"); attestation signed but map tampered (red twice, on the signature AND on the
  remapped commit being absent). And no regression: against the real un-rewritten tree the
  patched guard prints exactly what the shipped one prints.
  .
  === THE PIN COUNT, AND THE VACUITY IT CLOSES ===
  .
  D0115 makes one condition non-optional: a degraded `check_concepts.py` must COUNT the
  pins it verified against an expectation not derived from the files it is checking, or
  publication installs species I of D0116's taxonomy inside its own publication door. The
  expectation goes in `governance/policy.yaml` (`concept_registry.expected_citation_pins:
  13`) — owner-signed, in `required_signatures`, and not a file the degraded path also
  skips. Thirteen is measured: 13 `snapshot.path` entries across 8 records, all unique.
  Eight probes, all run: baseline 13-by-bytes green; one snapshot absent -> 12+1 green; the
  PUBLISHED configuration (all 12 gone) -> 1+12 green where the shipped guard reports 12
  failures; then a concept record truncated away (11 != 13), the expectation key deleted,
  `policy.yaml` deleted outright, and `concepts/` emptied — all four RED. The shipped
  poison fixture still fails and still carries its marker.
  .
  === WHAT EXCISION DOES NOT REMOVE — THE QUESTION D0115 NEVER ASKED ===
  .
  The plan this executes carried an acceptance test `git log --all -p -S 'renavon' --
  concepts/` -> empty. The rehearsal falsified it, and the correction is the most useful
  thing this record carries. The borrowed TEXT goes; the CITATIONS stay, because they are
  what BRIEF §2 is for. A public reader still learns from `concepts/*.yaml`: four
  repository URLs including `renavondata/renavon-monorepo`; nine document paths including
  `docs/architecture/decisions/002-pipeline-rigour-stance.md`; section titles quoted
  verbatim, the renavon row's being an internal ADR heading; five pinned commit SHAs of
  private repositories. And `BRIEF.md` — frozen at `brief-freeze`, constitutional,
  unamendable — names all four in its §1 constellation table and describes the last as "The
  business; funds and supplies the empirical substrate".
  .
  So the owner's ruling answered "may this repo quote 58 lines of that ADR" and the
  remaining question is "may this repo NAME that repository, its ADR path and its section
  heading in public". They are different questions and only the first was put. If the
  answer to the second is also no, the renavon `source` entry leaves
  `concepts/provenance-ref-grammar.yaml`, `expected_citation_pins` becomes 12, the concept
  keeps its pkm source and stays `S-pending`, and the registry loses one of the two owners
  BRIEF §2 names for that row — a weakening of the citation discipline, not a tidy-up. It
  is queued as part of this record rather than guessed at.
  .
  === ALSO CORRECTED HERE, BECAUSE D0045 MAKES D0115 IMMUTABLE ===
  .
  D0115 binds `governance/policy.yaml#external_surface.publishing` with `strength:
  enforced`. Measured at `5f206cc`: that key is read by NOTHING. It appears in prose and in
  the `check-manifest-unsigned-policy` poison fixture, nowhere in any guard. Its owner
  signature makes the clause unforgeable; no guard consults it before bytes leave. The
  binding should read `documentary`. And per D0175 the home-path disclosure count D0115
  shows the owner is five, not four.
  .
  === STAGED, NOT APPLIED ===
  .
  Nothing in `docs/proposals/2026-09-06-publication/` is applied: two patches to custody-set
  guards, three owner edits to signed files, four root files (a LICENSE at the root IS the
  grant, which is why D0115 refused to pre-write one and why this record does not either),
  and one poison fixture candidate. The 12 excised files are preserved outside git at
  `~/git/tannen/.reference/snapshots/`, mirroring their tracked layout beside the four
  sibling clones already there, so an authorised clone can restore byte verification.
rationale: >-
  Tier C, `status: blocked-on-owner`. It is the same door D0115 opened, but the acts it now
  names are ones D0115 did not: a history rewrite, eight re-signed tags including the trust
  root, and a declared break in the receipt chain. `check_decisions.py` (RT-06, D0064)
  refuses a Tier-C record recording `accepted` without an owner signature, and correctly —
  a builder session that treated the rehearsal's success as authorisation to run the
  rewrite would be converting its own measurement into a permission.
  .
  Filed now rather than at the sitting because the rehearsal's findings expire: the tag
  objects, the trust-root pin and the commit count are all measurements of `5f206cc`, and a
  record written after the fact would be a reconstruction. The two corrections to D0115 are
  here for the same reason D0121 exists — D0045 makes the decision field immutable, so a
  claim that measurement falsifies is corrected by a new record bound to the old one, never
  by an edit.
  .
  DELIBERATELY NOT DONE: no repository created, no remote added, no rewrite run outside a
  disposable clone, no tag deleted or re-signed in the real repository, no custody-set file
  edited, no LICENSE at the root, no poison fixture installed, and no concept record
  changed pending the renavon question above. The rehearsal wrote nothing outside its own
  scratch directory, which the script asserts as its closing line.
reversibility: >-
  Everything in this package is reversible; the act it prepares is not, twice over. Bytes
  that leave are gone — a public repository is cloned, cached and indexed within hours, and
  deletion removes the URL rather than the copies. And the receipt chain's guarantee, once
  spent, cannot be re-earned: a future reader can verify that this rewrite was declared and
  signed, but not that the pre-rewrite history was what the receipts said it was. That is
  the price of the excision and it is paid knowingly. The mitigation is that the
  discontinuity is legible — one signed file, a complete map, and this record — rather than
  a gap someone has to notice.
status: accepted
