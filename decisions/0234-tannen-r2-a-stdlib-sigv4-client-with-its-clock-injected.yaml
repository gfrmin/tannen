# Decision record — validated against governance/schemas/decision-record.schema.json.
id: D0234
title: "tannen.r2 is a standard-library SigV4 client pinned to AWS's own test vector, with its clock injected because L4.9 denies it one, its credentials explicit, every failure an OSError, and no test able to reach a network"
tier: A
date: "2026-09-12"
risk_flags: []
decision: >-
  `tannen.r2.R2Client` implements `ObjectClient` over R2's S3 API with the standard library only
  (`urllib`, `http.client`, `hmac`, `hashlib`, `xml.etree`): a conditional PUT
  (`If-None-Match: *`; 412 means "already there", answered False), a GET (404 answered None),
  and a paginated ListObjectsV2.
  .
  EVERY FAILURE IS `R2Error`, AN `OSError` — which is what lets `tannen.oracles` report a failed
  remote write as `CaptureWriteFailed`. The first draft made an unexpected status one; this
  session's silent-failure review found three more that were not, each now `R2Error`: a
  connection that breaks mid-response (`http.client.HTTPException` is not an OSError, and whether
  a PUT landed is then unknown), a `clock()` that does not return SigV4 time (refused before
  anything is sent), and a listing that is not one — a non-`ListBucketResult` root or a missing
  `IsTruncated` used to read as an EMPTY page, and on a store that means every capture lookup a
  miss and every spend fold zero. Redirects are not followed: the default opener is built
  without a redirect handler, so a signed request answered from elsewhere is a status, and a
  failure.
  .
  THE SIGNER IS PINNED TO A VECTOR THIS REPO DID NOT WRITE: AWS's Signature Version 4 test
  suite, case `get-vanilla` (`awslabs/aws-c-auth`, `tests/aws-signing-test-suite/v4/get-vanilla/`)
  — its canonical request and its signature `5fa00fa3…fbf31`, fetched and reproduced locally
  with an independent HMAC chain on 2026-09-12 before being pinned. The suite's own access-key
  id (`AKIDEXAMPLE`) is used because it is not AWS-key-shaped, so the PII guard's credential
  pattern does not fire on the fixture.
  .
  THE CLOCK IS INJECTED. SigV4 signs a timestamp, and frozen L4.9 lets only `tannen.oracles` and
  `tannen.laws` import a clock module; `tannen.r2` is a network door, not a clock door. The
  CREDENTIALS are constructor arguments and are never printed (`repr` names the bucket and host
  only; errors carry a status and at most 200 bytes of body); nothing reads the environment,
  because an ambient credential is exactly the hidden input BRIEF §5.3 rules out. The opener is
  injected too, so `tests/test_r2.py` drives every call through a fake.
  .
  NOT CLAIMED: that R2 accepts these requests. A write to a real bucket is Tier-C door 2 and is
  queued for the owner (D0228).
rationale: >-
  boto3 would be a large dependency for three calls, and it reads credentials and a clock from
  the environment by default — the opposite of this repo's correct-by-default rule. A vector
  from AWS's own suite checks the algorithm against a party that is not the implementer, which a
  round-trip test cannot.
reversibility: Reversible in code; nothing depends on it until D0228 is ruled.
status: accepted
bindings_count: 1
bindings:
  - type: pytest
    target: tests/test_r2.py
    strength: enforced
    detail: The get-vanilla vector, the calls' wire shape through a fake opener, every failure an OSError, the strict listing, no redirects.
links: ["D0221", "D0223", "D0228"]
