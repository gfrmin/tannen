# Decision record — validated against governance/schemas/decision-record.schema.json.
id: D0005
title: DuckDB is the L6 differential oracle
tier: A
date: "2026-08-24"
decision: >-
  Law L6 (differential correctness on the SQL-expressible fragment) tests against
  DuckDB, with the no-NULL mapping explicit. DuckDB enters the stack as a dev
  dependency at M1, outside the kernel package (the kernel-no-io import contract
  already forbids the kernel importing it).
rationale: >-
  Pre-decided in BRIEF §6/§9 as never-ask-again; the pkm constellation already uses
  DuckDB, and the DBSP differential-testing method (BRIEF §11) needs a trusted
  relational oracle.
reversibility: >-
  Swapping oracles rewrites the L6 harness only; laws and evidence records identify
  the oracle, so old evidence stays valid as evidence about the old oracle.
status: accepted
bindings:
  # Added at the M1 laws freeze (D0045). The unenforced_reason this replaces read "binds to
  # the L6 suite when M1 freezes it (harness names DuckDB and the no-NULL mapping)"; the
  # freeze has happened and the harness does both.
  - type: manifest
    target: tests/laws/m1/test_l1_duckdb.py
    strength: enforced
    detail: >-
      L1.16, the differential law. It imports duckdb directly rather than through
      importorskip, so an absent oracle is a loud collection error and never a silent skip
      that would read as a pass.
  - type: manifest
    target: tests/laws/m1/_fragment.py
    strength: enforced
    detail: >-
      The frozen no-NULL mapping — 22 shapes, each with the SQL it must agree with, plus
      the generators that keep the value domain inside what SQL can represent.
  - type: config
    target: pyproject.toml#dependency-groups.dev
    strength: enforced
    detail: duckdb pinned exactly (D0079), so an upgrade cannot change the oracle under a frozen law.
links:
  - "BRIEF.md §6 (L6), §9, §11"
