  - type: file
    target: docs/proposals/2026-09-06-publication/publication_sitting.sh
    strength: enforced
    detail: >-
      The `policy_licence` editlet at step 2 (idempotent, anchor-asserting, watched running
      twice against a real copy of `policy.yaml` and parsing as YAML afterwards); the step
      breadcrumb written by `say()`; and `die()`'s two-regime recovery message.
  - type: file
    target: docs/proposals/2026-09-06-publication/rehearse_publication.sh
    strength: enforced
    detail: >-
      `--abort-at N`, the two-regime verdict, the performed recovery, and the completion
      check that the green path's breadcrumb ends at "The sitting is closed" — so the
      breadcrumb is non-vacuous in both modes.
  - type: config
    target: governance/policy.yaml#licence_defaults
    strength: documentary
    detail: >-
      The key the sitting rewrites to Apache-2.0 at step 2. Documentary, not enforced, and
      deliberately so: no guard reads `licence_defaults` any more than it reads
      `external_surface.publishing` (D0176 corrected D0115 on exactly that point). What makes
      the file agree with the `LICENSE` at the root is the owner's signature over it at step
      G, not a check.
  - type: file
    target: docs/proposals/2026-09-06-publication/README.md
    strength: documentary
    detail: >-
      The runbook: step 2's row names the licence edit, and "two lines only you can settle"
      is now one — the adoption of the rewritten history by the bare repository, with the
      backup ref that makes it cheap.
  - type: file
    target: decisions/0176-publication-the-history-rewrite-the-declared-discontinuity-and-what-excision-does-not-remove.yaml
    strength: documentary
    detail: >-
      Ruling (2), taken by the owner on 2026-09-06 and immutable under D0045. This record
      executes it; it does not re-decide it, and the licence text is not restated here.
