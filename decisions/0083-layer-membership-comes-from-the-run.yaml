# Decision record — validated against governance/schemas/decision-record.schema.json.
id: D0083
title: The layer chain, and why membership is carried in the value rather than parsed for
tier: A
date: "2026-08-25"
decision: >-
  The four layers form a chain under operator-set inclusion: capture (nothing) ⊏ serve
  (project, select) ⊏ decode (+ map_rows) ⊏ derive (all eight). layer_of(operators) is the
  least layer admitting them; check_layer accepts a declaration at or wider than that and
  raises LayerError on a narrower one. The operator set comes from the RUN: every Outcome
  carries `operators`, unioned from its inputs plus the operator's own name, so
  Built.layer = layer_of(outcome.operators). @transform(layer=...) is an optional
  declaration defaulting to None = infer, and the executor refuses a declaration narrower
  than what actually ran.
rationale: >-
  BRIEF P8 says membership is statically checked, and a static AST scan of the transform
  body was the obvious reading. It is wrong in the UNSAFE direction: an operator reached
  through getattr, an alias, or a helper the scan does not follow yields a NARROWER inferred
  layer than the truth — a node claiming more restraint than it practises, which is exactly
  the failure the check exists to prevent. A static check that fails open is worse than a
  runtime one that fails closed. Carrying the membership in the value keeps the kernel pure
  (it is data on the Outcome, not a global counter), makes the check exact, and satisfies
  §5.9's "defaults to the most restrictive admitting its operators" literally, because the
  default IS computed from the operators.
reversibility: >-
  Adding a static pre-check later is additive. The `operators` field is part of Outcome's
  shape, so removing it would be an API change; it is not part of any content address.
status: accepted
bindings:
  - type: manifest
    target: tests/laws/m1/test_l1_layers.py
    detail: L1.10 pins the membership table, the chain, layer_of, and that narrowing is refused while widening is accepted.
  - type: manifest
    target: tests/laws/m1/test_l1_executor.py
    detail: L1.14 asserts Built.layer is what actually ran and that a transform declaring a narrower layer than it runs is refused at build.
  - type: pytest
    target: tests/laws/m1/test_l1_layers.py
    strength: enforced
    detail: >-
      Upgraded at M1 Session B (D0045) when the law went green: the manifest row proves the
      law is frozen, this node proves it runs and passes.
links:
