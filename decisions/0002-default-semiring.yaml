# Decision record — validated against governance/schemas/decision-record.schema.json.
id: D0002
title: Default semiring is ℤ × Why
tier: A
date: "2026-08-24"
decision: >-
  Rel's default annotation semiring is the product ℤ × Why: every pipeline gets deltas
  and support-set provenance unless it explicitly opts down (annotations=Z_ONLY) with a
  recorded reason.
rationale: >-
  Pre-decided in BRIEF §5.5 and listed in §9 as never-ask-again. Lineage without asking
  is the correct-by-default posture; opting down is the ugly, explicit path.
reversibility: >-
  A different default changes what un-annotated pipelines compute; existing explicit
  annotations are unaffected. One-line default change plus regenerated goldens.
status: accepted
bindings:
  # Added at the M1 laws freeze (D0045: bindings may be added; the decision itself stays
  # immutable). The unenforced_reason this replaces read "pre-M0: binds to the M1 Rel
  # constructor-default property test" — which is the artifact below, now frozen.
  - type: manifest
    target: tests/laws/m1/test_l1_rel.py
    strength: enforced
    detail: >-
      L1.5 asserts a Rel built with no annotation argument carries Z*Why, that any other
      explicit choice without annotations_reason raises, and that the reason is absent from
      the canonical bytes. Session B upgrades this to a pytest binding when the law is green.
  - type: pytest
    target: tests/laws/m1/test_l1_rel.py
    strength: enforced
    detail: >-
      Upgraded at M1 Session B (D0045) when the law went green: the manifest row proves the
      law is frozen, this node proves it runs and passes.
links:
  - "BRIEF.md §5.5, §9, P4"
