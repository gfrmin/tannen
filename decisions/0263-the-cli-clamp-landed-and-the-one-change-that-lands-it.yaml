# Decision record — validated against governance/schemas/decision-record.schema.json.
id: D0263
title: "The CLI spend clamp landed: --budget-override is the one spelling that spends against another file, L4.4's third node is promoted to `superseded`, and the pre-budget lock's open set is down to {current-envelope}"
tier: A
date: "2026-09-16"
risk_flags: ["spend", "governance-paths"]
decision: >-
  M5 Session B1 discharges docs/specs/m5.md §6 and with it D0240 item (2), deferred to M5 by
  D0241 and pinned by D0258. `tannen run` no longer honours whatever budget a caller names.
  .
  WHAT LANDED. `--budget` and `--budget-override` are now a mutually exclusive argparse group,
  so naming both is a usage error (exit 2) rather than a precedence rule. Under `--spend`:
  no flag, or `--budget` naming the checked-in budget.yaml at find_root(), admits against that
  file; `--budget` naming any other file raises SpendDenied naming `--budget-override`;
  `--budget-override PATH` admits against PATH. Without `--spend` neither flag is consulted at
  all. `admitting_budget` and `checked_in_budget` are public in `tannen.cli`, so the rule is a
  function a test can call rather than a branch buried in `_run`.
  .
  THE REFUSAL IS EARLIER THAN THE SPEC REQUIRES, and deliberately. §6 says "before the
  transport"; the clamp is evaluated before the pipeline module is even imported and before a
  Store is opened, so a refused invocation runs none of the operator's code. The weaker
  placement would satisfy L5.1 identically, which is exactly why the choice is recorded rather
  than left to the reader of a diff.
  .
  TWO SILENCES PINNED (Tier A, BRIEF §9). (1) `--budget` is compared to the checked-in file by
  `Path.resolve()`, so a relative or symlinked spelling of the SAME file is admitted, not
  refused: the rule is about which file is authorised, never about how it was spelled.
  (2) `--spend` with no checked-in budget.yaml at find_root() is SpendDenied naming
  `--budget-override`, not a FileNotFoundError — a refusal by name, the way every other thing
  this command declines is.
  .
  ONE CHANGE, AND IT IS FOUR ARTIFACTS, NOT THREE. §6 names three (clamp, promotion, the
  pre-budget lock's strict node). The fourth was named in advance by the file that holds it:
  `tests/test_law_validation.py::test_the_pending_retirement_is_the_node_m5_names_and_it_still_passes`
  asserted the node still PASSED, and its own docstring said "M5 Session B promotes the entry,
  and replaces this test with that one's shape, in the change that lands the clamp". It is
  replaced by `test_the_m5_retired_node_actually_fails_now`, which runs the retired node under
  `--runxfail` and requires it to fail FOR THE CLAMP'S REASON — SpendDenied naming
  `--budget-override` — because a bare "it fails now" would be satisfied by a node that broke
  for any reason at all. Its sibling registry node moved from "one superseded entry, one
  pending" to "two superseded, pending empty".
  .
  L5.1 SLEEPS EVERYWHERE BUT THE OWNER'S MACHINE (D0259), so the clamp would otherwise ship
  with nothing in CI running it: the model matrix checks the rule against the MODEL, and the
  pre-budget lock only asks whether the flag is DECLARED. `tests/test_export_cli.py` gains the
  live half — seven new nodes over a throwaway repository root, plus the one existing node that
  had to move. Watched against the pre-clamp `cli.py` restored from HEAD: six of those eight
  FAIL. The two that do not are honest about what they are: a zero checked-in ceiling refusing (a retained L4.5 claim, not a clamp claim) and
  `--budget` naming the checked-in file by a relative path (which discriminates against a clamp
  that is too TIGHT, the `override-ignored` mutant's shape, not against the old CLI).
  .
  ONE UNFROZEN TEST HAD TO MOVE, and it is the `filler` pattern D0137 named:
  `test_a_returned_capture_ref_is_printed` spent through `--budget` with a budget of its own.
  The budget file was never what the node was about — it asserts that a returned capture ref
  reaches stdout — so only the spelling changed, to `--budget-override`. Its neighbour
  `test_spend_without_a_budget_authorises_nothing` was RENAMED rather than kept green: under the
  clamp there is no such thing as `--spend` with no budget, and the node passed only because
  every ceiling in the checked-in budget.yaml is zero. It now says that, hermetically, over a
  throwaway root — a test whose premise has quietly moved is worse than one that fails.
  .
  WATCHED, NOT ASSUMED. With the clamp landed and the entry still `pending`, the gate went RED
  in exactly the way D0258 predicted: the pending node failed and the two registry nodes failed
  with it (2 failed, 119 passed). With the promotion applied, L4.4's third node reports as the
  one xfail of the M4 modes file and the suite is green — the retirement is a live assertion,
  not a claim about the future. The pre-budget lock's open set is now {current-envelope} alone,
  and the lock stays ARMED on it: D0253 measured that D0244's fold never reached
  scripts/check_manifest.py, which is still D0243's bytes and still compares each ceiling
  against the MAXIMUM envelope over all milestones. That item is the pre-budget sitting's, not
  Session B's.
rationale: >-
  D0240's ruling was that the authorisation a library enforces is the one it is handed, so the
  question "which budget may a caller name" has to be answered in the shell, where a repository
  may read its own files. Landing that answer without promoting the retirement would leave
  governance/laws.yaml describing a past that no longer exists, and promoting without landing it
  would put a strict xfail on a passing node; D0128 built the two lists precisely so the two
  halves could be one commit.
reversibility: >-
  Reversible in-repo: the flag, the promotion and the strict node are three small edits, and
  reverting any one of them turns the gate red rather than passing quietly — which is the
  property that makes this cheap to undo safely. Every ceiling in budget.yaml is still zero, so
  nothing here can spend whatever the flags say.
status: accepted
bindings_count: 6
bindings:
  - type: file
    target: src/tannen/cli.py
    strength: enforced
    detail: The clamp itself — `admitting_budget`, the mutually exclusive flag group, and the refusal raised before the pipeline is imported.
  - type: file
    target: governance/laws.yaml
    strength: enforced
    detail: The promoted `superseded` entry; conftest.py marks the node xfail(strict=True) from it, so a reverted clamp is an XPASS and a red gate.
  - type: pytest
    target: "tests/test_law_validation.py::test_the_m5_retired_node_actually_fails_now"
    strength: enforced
    detail: Runs the retired node under --runxfail and requires it to fail by the clamp's own SpendDenied naming --budget-override.
  - type: pytest
    target: "tests/test_spend_preconditions.py::test_each_d0240_precondition_is_open_today_and_the_gate_names_it"
    strength: enforced
    detail: "The strict node, now {current-envelope} alone: it fails if a precondition closes or re-opens without this set moving with it."
  - type: pytest
    target: "tests/test_export_cli.py::test_a_budget_naming_another_file_is_refused_before_anything_is_touched"
    strength: enforced
    detail: The clamp run against the shipped CLI at every commit, while L5.1 sleeps under D0259's sentinel — refusal by name, nothing written, the pipeline never imported.
  - type: manifest
    target: tests/laws/m5/test_l5_clamp.py
    strength: enforced
    detail: L5.1, the frozen judge of the rule. `manifest`, not `pytest` — every M5 law skips until an authorised corpus is present (D0259).
links: ["D0128", "D0137", "D0237", "D0240", "D0241", "D0242", "D0243", "D0244", "D0253", "D0258", "D0259", "D0264"]
