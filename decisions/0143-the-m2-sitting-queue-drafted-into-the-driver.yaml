    target: docs/proposals/2026-08-31-m2-boundary-sitting/boundary_sitting.sh
    strength: documentary
    detail: >-
      The driver itself. Documentary and it must stay so until the owner runs it — a drafted
      patch awaiting owner application enforces nothing, which is the distinction D0052's
      `strength` field exists to make.
  - type: file
    target: docs/proposals/2026-08-31-m2-boundary-sitting/upgrade_binding.py
    strength: documentary
    detail: >-
      Step 4h's applier, a separate file rather than an inline heredoc because three
      near-identical multi-line YAML edits are unreadable inline and untestable in place.
      Applied and re-refused in a sandbox against a copy of decisions/.
  - type: file
    target: docs/proposals/2026-08-31-m2-boundary-sitting/poison-readme-rows.md
    strength: documentary
    detail: Step 5's table row for oracle-shadow-model, in the M1 rows file's shape.
  - type: file
    target: docs/proposals/2026-08-31-m2-boundary-sitting/README.md
    strength: documentary
    detail: >-
      The run sheet: what each step does, the three judgement calls, and the rehearsal
      coverage gap `--from worktree` cannot close.
