# Decision record — validated against governance/schemas/decision-record.schema.json.
id: D0204
title: "Four false sentences in the frozen M3 spec, superseded forward — and the half of the D0128 mechanism that cannot apply to prose"
tier: A
date: "2026-09-09"
risk_flags: ["governance-paths"]
decision: >-
  EXECUTED, under the owner's release of 2026-09-09. `docs/specs/m3-corrections.md` now
  carries four sentences of `docs/specs/m3.md` at their true strength, the frozen file is
  retained and UNEDITED, `MANIFEST.sha256` gains the new file's row and a supersession note
  pointing from the old locations to the new, and this record binds them. Verified after the
  fact: `check_manifest` reports OK — frozen paths intact, seals unbroken, custody set
  current.
  .
  THE FOUR. (1) §7's input triple `(state_ref, ledger_ref, sorted delta refs)` names three
  inputs where a node's FIRST TICK HAS TWO, and `derivation_id` normalises the order of the
  whole input list rather than the child refs inside a fixed tuple
  (`src/tannen/kernel/derivation.py:32`; `src/tannen/incremental.py:523-524`). The word
  `sorted` further conceals a live collision: a binary node's two operand orders share one
  `step_id` (RT-M3-03, D0174). (2) §7's "a pure function of those inputs" was false when
  frozen — a step was also a function of the module-level registry, named in none of the
  inputs (RT-M3-01) — and is true today only because of D0197, which the frozen sentence
  cannot name. (3) §7's "replaying a stream hits traces", ruled false by the owner at D0171
  ruling (1): `advance` consults the trace and by default writes none. (4) NEW, and found
  only because the draft was attacked rather than read (D0203): §10's L3.15 law-table row
  REPEATS claim (3) VERBATIM at :444. Correcting the body and leaving the summary row is
  the D0049 shape — a corrected artifact with a stale index, in the location a reader
  reaches for first.
  .
  THE MECHANISM, AND THE HALF OF IT THAT DOES NOT APPLY. D0171 ruling (1) directed the
  correction "under the D0128 mechanism". D0128 has two halves and only one of them is
  usable here. Its `governance/laws.yaml` retirement machinery — an entry naming a node,
  plus `conftest.py` marking that node `xfail(strict=True)` — is NOT used, because D0161
  already holds that "prose is not a node; the supersession machinery (D0128) retires law
  nodes, and running it against prose would be a category error". No node is retired,
  `laws.yaml` is untouched, no law changes status. What IS used is D0106 ruling 2's other
  half, which applies to any frozen artifact: a new file, the old one retained and annotated
  in the manifest notes, and a record binding the two. Stated explicitly because the
  instruction and the precedent appear to conflict and the next session should not have to
  re-derive which part of each survives.
  .
  THREE FURTHER PASSAGES ARE DELIBERATELY NOT CORRECTED, and this is the part a later reader
  is most likely to mistake for an omission. `docs/specs/m3.md:202`, `:324` and `:318` were
  each proposed as falsified and each refuted (D0203): `:202` is correctly scoped to L3.15's
  empty-tick claim and its proposed replacement contradicted the corrected §7 text; `:324`
  and `:318` are INCOMPLETE, NOT FALSE, and neither claims exhaustiveness. Freezing new
  prose that asserts a falsity which does not exist would manufacture exactly the
  frozen-versus-true gap this correction closes, while reporting the job done.
  .
  AND THE CORRECTED TEXT STATES ITS OWN OPEN DEFECTS RATHER THAN PROMISING THEM AWAY. Two
  remain live: a node whose operand roles are not interchangeable must carry those roles in
  its declared form, which this executor does not yet do; and a `map_rows` node's registered
  out-schema is still resolved from the registry at tick time and appears in no descriptor,
  so RT-M3-01's class is narrowed by D0197 rather than closed. Written as requirements
  violated, not as behaviour described — so the replacement text stays TRUE whether or not
  those defects are fixed, and survives a revert of D0197 by becoming a violated requirement
  rather than a false sentence.
rationale: >-
  Landed as builder work under the standing delegation, on the owner's explicit release of
  2026-09-09, after D0203 measured that the owner-key residue was empty: `MANIFEST.sha256`
  does not list itself; `governance/custody.sha256` carries zero `docs/` paths; BRIEF §9.1
  author-key territory is a closed three-path set that a spec is not in; `tier-c.yaml:152`
  says nothing signs the manifest; and both precedents, D0128 and D0161, are Tier A and
  unsigned. The release is recorded in D0201's successor question rather than inferred — the
  measurement was authority to ask, not to proceed.
  .
  Tier A because it is reversible in the ordinary sense and touches no signed artifact: a
  new file in an unsealed directory, one appended manifest row, one comment block. The
  frozen bytes of `docs/specs/m3.md` are not edited, cannot be, and were verified intact by
  `sha256sum -c` both before the work and after it.
  .
  The `:444` finding is the transferable one. Three sessions read the §7 passage and none
  noticed the §10 table restating it, because a table is where a reader goes to look
  something up rather than to check it. Any future supersession of prose should grep the
  law table for the sentence it is correcting, and this record is where that instruction
  lives.
reversibility: >-
  Reversible: delete the file, drop the manifest row and the note. Nothing is signed and no
  frozen byte moved. The irreversible-seeming part — that this record cannot be un-recorded
  — is true of every record under D0045 and is therefore not what would make it a door;
  D0203 sets out that argument in full.
status: accepted
bindings_count: 3
bindings:
  - type: manifest
    target: docs/specs/m3-corrections.md
    strength: enforced
    detail: >-
      The corrected prose, frozen by its own manifest row so the correction is as durable as
      what it corrects. Enforced rather than documentary because `check_manifest` verifies
      the hash on every run and every commit: an edit to the corrected text is refused the
      same way an edit to the original would be.
  - type: file
    target: docs/specs/m3.md
    strength: documentary
    detail: >-
      The superseded original, retained and unedited — verified byte-intact against
      `MANIFEST.sha256:76` by `sha256sum -c` after the work. Documentary and must remain so:
      the whole mechanism is that this file never changes.
  - type: file
    target: MANIFEST.sha256
    strength: documentary
    detail: >-
      Carries both halves of the bookkeeping — the new file's hash row, and the supersession
      note naming the four locations and pointing at the replacement. The note is where a
      reader of the frozen spec finds out it has been corrected.
links: ["D0203", "D0201", "D0171", "D0161", "D0128", "D0106", "D0197", "D0174", "D0049"]
