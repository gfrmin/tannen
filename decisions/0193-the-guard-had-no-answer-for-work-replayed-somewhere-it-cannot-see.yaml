# Decision record — validated against governance/schemas/decision-record.schema.json.
id: D0193
title: "The post-sitting guard had no answer for work replayed somewhere it cannot see, so the first real adoption went around it by hand; --accept-unmapped is that manoeuvre made checkable"
tier: A
date: "2026-09-08"
risk_flags: ["governance-paths"]
decision: >-
  `adopt_published_history.sh` takes a repeatable `--accept-unmapped <sha>`. Each occurrence
  is the operator asserting that one named post-sitting commit's work is already in the
  published history under a sha this repository never held. The assertion is not taken on
  trust: the script re-derives that commit's own paths from its diff and looks each one up at
  the published head, refusing the flag if an added or modified path is missing there, if a
  deleted path is still present, or if not one path matches byte for byte.
  .
  THE GAP. D0190 refuses to adopt while `master` carries a commit the published history does
  not have; D0192 fixed its remedy to replay -> push -> adopt. Both assume the replay happens
  HERE. At the real adoption it had not: D0189's and D0190's fixes were made in the rewrite
  clone, mid-sitting, because that is where the sitting's own defects surface. Their content
  shipped; their local shas never will be in the map, and no number of re-runs changes that —
  there is nothing left to replay. The guard was right to refuse and had no exit, so the
  first real adoption was performed by hand: verify both records byte-identical at the
  published head, name the old tip under `refs/backup/pre-publication-2026-09-08/`, reset
  `master` to commit A, run the script. That worked and is not a procedure — a hand-moved ref
  around one's own guard is the thing the guard exists to prevent someone doing casually.
  .
  WHY IT CHECKS CONTENT RATHER THAN JUST ACCEPTING THE WORD. A `--force` here would discard
  exactly the claim at issue. The guard's real question is not "do the shas line up" but "did
  the work ship", and that question has a cheap direct answer: the commit's own paths, at the
  published head. Measured against the two real commits it reports 2 identical + 2 changed
  downstream and 4 identical + 2 changed — the same numbers the manual check produced, now
  printed by the script instead of by a person. A commit whose file is genuinely absent is
  refused; so is a flag naming a commit that was mapped all along, which would otherwise read
  as cover for the commit actually at risk.
  .
  Verified by running all five states against a disposable bare clone fetching the real
  published repository: no flag still refuses and names both commits; the flag on a mapped
  sha refuses; the flag on a fabricated commit carrying a file that never shipped refuses
  naming that file (and again with a space in that path, since the report is what justifies
  accepting the flag and must not split one entry into two); the flag on a commit whose every
  path is byte-identical passes with nothing changed downstream; the flag on both real
  commits passes and adopts to the published head.
rationale: >-
  Tier A: one file under `docs/proposals/`, one record, no frozen path, nothing signed. The
  flag can only ever let adoption proceed on a claim the script has just checked; without it
  the operator's alternative is moving refs by hand, which checks nothing at all.
  .
  The escape is deliberately per-commit and positional. A blanket `--accept-all-unmapped`
  would pass the fabricated commit in case D above along with the real ones, which is the
  whole failure this package keeps rediscovering: a check whose input set is not what it
  looks like. Requiring at least one byte-identical path is the non-vacuity floor — it is
  the positive control, and a commit whose every path was changed downstream is refused
  rather than waved through, because nothing there demonstrates the work arrived.
  .
  Fifth instance of the standing pattern: a rule correct about the state it was written
  against and silent about the state that comes next. D0190 assumed master was the sitting's
  commit A; D0192 assumed the replay happens locally; this assumes neither.
reversibility: >-
  Dropping the flag and its block, and this record. Nothing else in the repository depends
  on it; adoption without the flag behaves exactly as D0192 left it.
status: accepted
bindings_count: 1
bindings:
  - type: file
    target: docs/proposals/2026-09-06-publication/adopt_published_history.sh
    strength: enforced
    detail: >-
      `--accept-unmapped` is parsed, is per-commit, refuses a sha the guard does not stop on,
      refuses a commit with no diff, refuses a path missing at the published head or a
      deletion that did not happen there, and refuses when no path is byte-identical.
links: ["D0192", "D0190", "D0187", "D0176", "D0045"]
