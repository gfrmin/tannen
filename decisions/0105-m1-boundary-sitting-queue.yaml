# Decision record — validated against governance/schemas/decision-record.schema.json.
id: D0105
title: "The M1 boundary sitting: what needs the owner's key, in the order it needs it"
tier: C
date: "2026-08-27"
risk_flags: [governance-paths]
decision: >-
  Queued for the M1→M2 boundary sitting, in this order (the order is load-bearing, per
  D0060's own precedent — a sitting's steps are not independently reorderable).
  .
  (0) Copy docs/proposals/2026-08-27-m1-boundary-sitting/boundary_sitting.sh over
  scripts/boundary_sitting.sh before running it. This is expected custody drift, tolerated
  by name in the copy's own unexpected_failures() (the same move step 6 makes for
  scripts/custodian.sh, one step earlier in the milestone's own life). Then run it:
  `bash scripts/boundary_sitting.sh m1`, or rehearse first with
  `TANNEN_REHEARSE_DRIVER=docs/proposals/2026-08-27-m1-boundary-sitting/boundary_sitting.sh
  bash scripts/rehearse_sitting.sh`.
  .
  (1) Step 5 installs the one M1 fixture ready today: oracle-shadow/ (RT-M1-01,
  docs/redteam/2026-08-26-m1-boundary.md, D0102). check-decisions-file-skip/ (RT-M1-05,
  D0103) is NOT in step 5's list — it installs in step 5b instead (item 2), because it
  cannot land before the patch that makes its poison meaningful, and step 5's own
  fixtures all pre-date that patch.
  .
  (2) UPDATE (second pass, same session, after scripting this queue as far as it goes):
  step 5b now applies RT-M1-05's patch
  (docs/redteam/fixture-candidates/check-decisions-file-skip/rt-m1-05-check-decisions.patch,
  touching scripts/check_decisions.py and tests/test_governance_scripts.py) and installs
  the check-decisions-file-skip/ fixture and its tests/poison/README.md row, in one
  driver step — confirm-and-diff, same idiom as every other step, not a bash-free hand
  edit. Both still land together: scripts/check_decisions.py is a custody-set member, so
  the patch alone (without the custody re-signature only step 7 can give) would leave
  every subsequent commit blocked by D0063's own file-level binding on
  tests/test_governance_scripts.py — this is why the fix could not be committed by the
  builder session that drafted it (D0103's own record), and why step 5b still stages
  into step 9's commit rather than committing itself. Verified before scripting: the
  patch applies clean, the fixture fails for the right marker
  (`unexplained skip`) once patched, and the invocation needs
  `PYTHONDONTWRITEBYTECODE=1` (not `-B` on the outer process — check_decisions.py runs
  pytest as a subprocess, which `-B` does not reach but the env var does) to avoid
  leaving an unmanifested `__pycache__` under tests/poison/. A second, independent
  hazard surfaced rehearsing this after that fix already held (rehearsal #8): the
  fixture's test file was named tests/test_mixed.py, the FIRST file in the whole
  tests/poison/ corpus to match pytest's default test_*.py discovery glob —
  pyproject.toml's testpaths=["tests"] has no exclusion for tests/poison/, so the bare
  `pytest -q` inside `make verify` swept it into the main suite once installed. Renamed
  to tests/mixed_cases.py (an explicit pytest target still collects regardless of
  filename); a repo-wide --ignore was considered and rejected as riskier, since every
  existing poison line's own pytest subprocess would need re-proving safe against it.
  .
  (3) UPDATE (same pass): step 4c now applies the two signed-record binding upgrades
  D0070 named and left drafted
  (docs/proposals/2026-08-27-m1-boundary-sitting/signed-record-binding-upgrades.md),
  gated on step 4b already landing (grep "Metric calibration" BRIEF.md), and re-signs
  both records in the same step. **A THIRD thing was found while scripting this, not one
  of D0070's counted three**: decisions/0049-close-tags-stay-owner-signed.yaml has a real
  corruption, present since whichever sitting last edited it and still there under its
  current valid-looking .sig — a missing newline folds its third binding (type: manifest,
  target: DELEGATIONS.md) into the SECOND binding's `detail:` prose instead of parsing as
  its own list entry. A plain YAML parse confirmed it (2 bindings on disk, 3 intended);
  no other decisions/*.yaml file carries the same defect (checked all of them the same
  way). The signature verifies against exactly this broken content — it is not a new
  mistake, and it was invisible to every guard because the malformed text still parses
  as valid YAML with a resolvable (if wrong) binding, and check_decisions.py has no way
  to know a record's bindings list is shorter than its author intended. Step 4c fixes
  the corruption and adds the new manifest:scripts/custodian.sh binding in the same edit,
  so the diff the owner reviews there is not just an addition — say so at the sitting
  rather than let it read as routine.
  .
  (4) Step 7 signs the custody set, covering everything steps 0-3 changed. Step 8 resolves
  the Tier-C queue: D0061 (custody set, not a signed manifest) and D0095 (required_tags
  lags). D0095 ITEM 1 (add m1-laws-freeze to required_tags) is mechanical and handled by
  this driver's own step 11, alongside m1-close, per D0095's own recommendation not to
  repeat the lag. D0095 ITEM 2 (replace the hand-kept enumeration with a rule that derives
  the required set) is explicitly a DESIGN DECISION, not a patch this sitting applies —
  D0095's own reversibility note says so ("a rule that over-derives would make every
  shallow clone fail the custodian, which is why it is proposed for a sitting rather than
  drafted here"). Accepting or declining item 2 at step 8 is a real choice with real
  consequences either way, not a formality item 1's mechanical addition can absorb.
  .
  (5) Step 9: gate, receipt, digest, commit.
  .
  (6) LAST: step 10 signs m1-close; step 11 adds m1-laws-freeze AND m1-close to
  governance/tag-roles.yaml required_tags in the same motion (D0095's own recommendation —
  this driver's step 11 already does both, not just the close tag D0060-era boundaries
  needed), then re-signs the custody set.
  .
  (7) One pre-emptive ruling worth the owner's attention while the key is out: RT-M1-01's
  REAL fix (a package-qualified import in the frozen tests/laws/m1/test_l1_duckdb.py) is
  CLAUDE.md's stated "frozen laws turn out to be wrong" case — not an in-place edit, but a
  new, superseding law file, the old one marked superseded in the manifest notes. BRIEF §8
  describes this for a milestone's OWN laws during its OWN Session B; it does not yet say
  what supersedes a law found wrong AFTER the milestone closed, at a later boundary. This
  sitting does not need to resolve that to close M1 — RT-M1-01's defence-in-depth check
  (D0102) already holds against the one reproduction found — but the owner should decide
  the supersession mechanism before the next law is found wrong the same way, rather than
  improvising it under time pressure at that sitting.
rationale: >-
  D0104 (the red-team pass's own summary) and D0102/D0103 (the two individual findings)
  each carry their own rationale; this record exists, as D0060 did for the M0→M1 sitting,
  so the digest's "Requires owner" section has one query-over-records artifact naming the
  actual sequence rather than requiring the sitting to reconstruct it from four separate
  records plus two proposal directories. `status: blocked-on-owner`, unlike D0060's own
  `accepted`: D0060 carries an owner signature from the actual M0→M1 sitting, and
  check_decisions.py (RT-06, D0064) correctly refuses ANY Tier-C record recording
  `accepted` without one — a builder session drafting this record has no owner key to
  give it one. Caught live: an early draft of this record said `accepted`, following
  D0060's status without checking that D0060's is backed by a real signature, and
  check_decisions.py refused it exactly as designed the moment it was checked against a
  clean tree (found while rehearsing this sitting, not by reading the record). The owner
  accepts and signs this one at step 1 or step 8, the same way any other freshly-queued
  Tier-C record does.
reversibility: >-
  Nothing here is irreversible except the m1-close signature (BRIEF §9.2, by
  construction) and the custody re-signatures, which are themselves re-issuable over a
  later state at the next sitting. Every applied patch, every fixture installation, and
  every binding upgrade can be reverted individually.
status: accepted
