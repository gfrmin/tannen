id: D0069
title: "The sitting spent its longest minute in silence and read as hung"
tier: A
date: "2026-08-25"
risk_flags: [governance-paths]
decision: >-
  Step 0 of scripts/boundary_sitting.sh ran the gate as `verify_out=$(make verify 2>&1)`
  and printed the captured output afterwards, so the driver's first question was followed
  by roughly fifty seconds of a completely still terminal — 174 tests, ten law suites and a
  batched pytest run inside check_decisions, none of it visible. The owner read that as a
  hang and killed the sitting twice before it reached step 1. It now streams through `tee`
  into a temporary log and reads PIPESTATUS on the following line; the log is what
  unexpected_failures parses, so nothing about the tolerance logic changes. Capturing output
  and displaying it are two acts and `$( )` performs only the first.
  .
  Where the capture came from is the part worth recording. Step 0 streamed the gate when the
  driver was written (D0062). It was changed to capture by the fix for D0065, which needed
  the gate's text in order to tell the two tolerated custody-set failures from a genuinely
  red gate — and took that text the obvious way, by substitution, silently trading the
  owner's view of the run for the script's. Fixing a real defect introduced this one in the
  same edit, which is the argument for the harness check below rather than for more care.
  .
  The convention that replaces the patch: a step about to be quiet for more than a moment
  announces it first, through a `waiting()` helper rather than an ordinary note, stating the
  expected duration. Three sites use it — the step-0 gate (~1 minute, measured), the step-5
  binding check (~15s), and the step-6 custodian run (~5s). The duration is measured on this
  machine and written down rather than guessed; being wrong by a minute is fine, being
  absent is not, because an unbounded wait with no output cannot be told from a hang.
  .
  scripts/rehearse_sitting.sh enforces the convention. It now writes a second transcript
  with the elapsed second on every line, and fails if any gap longer than 25 seconds is not
  preceded by a `[waiting]` line, printing the offending silences with the line that came
  before each. A new TANNEN_REHEARSE_DRIVER environment variable overlays a driver from
  somewhere other than the working tree, which is how this check was watched catching the
  defect that motivated it: reconstruct the pre-fix step 0 in a copy of the driver, point
  the variable at that copy, and the new check reports `50s of silence` where the owner sat
  looking at nothing, while the fixed driver in the same harness passes.
rationale: >-
  Recorded rather than fixed quietly because it is the same failure as D0065 through D0067
  in a form none of them covered, and the harness built for those did not catch it. Those
  were code paths that had never been executed; this one had been executed, in the
  rehearsal, correctly, and produced a perfect transcript. What the transcript cannot hold
  is WHEN the driver spoke, and a log written all at once at the end is byte-identical to
  one written progressively. The harness was blind to the defect because it is not a person
  waiting at a terminal — so the fix is to give it the one fact it was missing, the arrival
  time of each line, and a rule to check it against.
  .
  The rule is deliberately phrased against the STEP rather than the pause. A waiting() line
  arms tolerance until the next step header, because a slow command that streams — the gate
  does — puts its own output between the announcement and its quiet stretches; pytest alone
  goes twenty seconds between progress lines, and a rule that demanded the announcement sit
  immediately above every gap would fail on a busy machine for no defect at all. A check
  that cries wolf is a check people learn to skip.
  .
  This matters past a cosmetic annoyance for the same reason the tier system exists. The
  scarce resource is owner attention (BRIEF §9.2), and a driver that goes silent spends it
  on doubt: the owner must decide whether to wait or interrupt, with nothing to decide on,
  at the one moment the key is out from behind its passphrase. Interrupting is the wrong
  answer and it is the answer the silence invites — twice, here. A tool that asks for
  presence owes the present person a visible reason to stay.
  .
  The general rule, worth carrying to any later operator-facing script in this repo: never
  wrap a slow command in a command substitution merely to inspect its output afterwards.
  Stream it and keep a copy. If a wait is unavoidable, say how long it will be before it
  starts, not after it ends.
reversibility: >-
  Two builder-owned scripts; revert in minutes. The tolerance logic reads the same text from
  a file instead of a variable, so no check changes meaning. scripts/boundary_sitting.sh is
  in the custody set, so from step 7 the change is covered by the owner's signature.
status: accepted
bindings:
  - type: file
    target: scripts/boundary_sitting.sh
    strength: enforced
    detail: >-
      Carries the streaming gate and the waiting() helper, whose comment states the rule the
      harness checks.
  - type: file
    target: scripts/rehearse_sitting.sh
    strength: enforced
    detail: >-
      Carries the timed transcript, the silence check, and TANNEN_REHEARSE_DRIVER. A green
      run now asserts that the driver never goes quiet for over 25 seconds without saying so.
links: ["D0062", "D0065", "D0066", "D0067", "D0068"]
