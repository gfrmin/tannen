# Decision record — validated against governance/schemas/decision-record.schema.json.
id: D0022
title: Owner amendments 1–2 applied additively pre-freeze; manifest regenerated by the builder
tier: A
date: "2026-08-24"
decision: >-
  The two owner amendments of 2026-08-24 were applied during Session 0, BEFORE any
  owner signature exists: BRIEF.md gained §9.1 (custody floor) and §9.2 (reversibility
  tiers, policy-as-data, non-blocking rule, graduated autonomy) as pure appends; the
  §9.1/§9.2 points were transcribed faithfully with no rewriting of existing sections;
  CLAUDE.md gained two hard-rule bullets and one additive note in its Decisions
  section. Because MANIFEST.sha256 already covered BRIEF.md and CLAUDE.md, the builder
  regenerated those manifest rows in the same change set. This is legitimate exactly
  once: the manifest is builder-created and unsigned until the brief-freeze tag; after
  that signature, the same act on BRIEF §3/§10 or the trust roots becomes Tier-C
  (doors 4–5), and on anything else requires a boundary sitting re-signing.
rationale: >-
  Explicit owner instruction ("apply additively before brief-freeze"). Recording the
  pre-freeze manifest regeneration keeps the custody story honest: the freeze the
  owner signs is the amended text, and the record of the amendment path is part of
  the record.
reversibility: >-
  Until brief-freeze is signed, the owner can amend further the same way; afterwards,
  never without a sitting.
status: accepted
bindings:
  - type: manifest
    target: BRIEF.md
  - type: manifest
    target: CLAUDE.md
risk_flags: [governance-paths]
links:
  - "BRIEF.md §9.1, §9.2"
