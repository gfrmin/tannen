# tannen — M0: canonical encoding, content addressing, the write-once store, descriptor
# identity, and the law/evidence runner behind `tannen laws report` (docs/specs/m0.md).
[project]
name = "tannen"
version = "0.0.0"
description = "A kernel for pure, content-addressed, provenance-native data pipelines"
requires-python = ">=3.12"
# jsonschema is a runtime dependency because the laws runner CONSUMES the frozen
# evidence-record schema rather than restating its shape in Python (BRIEF §2: a second
# normative home for one shape is drift). Decision D0040.
dependencies = ["jsonschema>=4.26,<5"]

[project.scripts]
tannen = "tannen.cli:main"

[dependency-groups]
dev = [
    "hypothesis==6.165.10",
    "import-linter==2.13",
    "jsonschema==4.26.0",
    "pre-commit==4.6.2",
    "pydantic==2.13.4",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tannen"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Import contracts (BRIEF §5.3: no hidden IO; §1/§2: no cross-repo imports).
# The forbidden-modules lists below must cover governance/tier-c.yaml's
# forbidden_imports lists — scripts/check_manifest.py enforces that consistency
# (decision D0016), so tier-c.yaml stays the single human-readable source.
[tool.importlinter]
root_packages = ["tannen"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "kernel imports no IO modules (BRIEF §5.3)"
id = "kernel-no-io"
type = "forbidden"
source_modules = ["tannen.kernel"]
forbidden_modules = [
    "io",
    "os",
    "pathlib",
    "socket",
    "subprocess",
    "shutil",
    "tempfile",
    "urllib",
    "http",
    "ftplib",
    "asyncio",
    "aiohttp",
    "requests",
    "httpx",
    "sqlite3",
    "duckdb",
]

[[tool.importlinter.contracts]]
name = "kernel has no clock and no other nondeterminism (BRIEF P1, P7, §5.7)"
id = "kernel-no-clock"
type = "forbidden"
source_modules = ["tannen.kernel"]
forbidden_modules = [
    "time",
    "datetime",
    "calendar",
    "zoneinfo",
    "random",
    "secrets",
    "uuid",
]

[[tool.importlinter.contracts]]
name = "no cross-repo imports, in either direction (BRIEF §1, Tier C)"
id = "no-cross-repo"
type = "forbidden"
source_modules = ["tannen"]
forbidden_modules = [
    "pkm",
    "life_agent",
    "credence",
    "proplang",
    "renavon",
    "renavon_monorepo",
]
