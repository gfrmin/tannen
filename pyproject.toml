# tannen — M0: canonical encoding, content addressing, the write-once store, descriptor
# identity, and the law/evidence runner behind `tannen laws report` (docs/specs/m0.md).
[project]
name = "tannen"
version = "0.0.0"
description = "A kernel for pure, content-addressed, provenance-native data pipelines"
requires-python = ">=3.13"
# jsonschema is a runtime dependency because the laws runner CONSUMES the frozen
# evidence-record schema rather than restating its shape in Python (BRIEF §2: a second
# normative home for one shape is drift). Decision D0040.
#
# pyyaml is a runtime dependency from M4 because `tannen.oracles.load_budget` reads the
# checked-in `budget.yaml` (docs/specs/m4.md §4). Decision D0236.
dependencies = ["jsonschema>=4.26,<5", "pyyaml>=6,<7"]

[project.scripts]
tannen = "tannen.cli:main"

[dependency-groups]
dev = [
    # The L6 differential oracle (BRIEF §6, §9 pre-decided; decision D0005). Dev-only and
    # exact: L6 compares tannen against THIS DuckDB, so an unpinned range would let an
    # upgrade change the oracle underneath a frozen law and read as a tannen defect — the
    # first thing M1's kill criterion would blame. The kernel may never import it
    # (governance/importlinter.toml, contract kernel-no-io).
    "duckdb==1.5.5",
    "hypothesis==6.165.10",
    "import-linter==2.13",
    "jsonschema==4.26.0",
    "pre-commit==4.6.2",
    "pydantic==2.13.4",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tannen"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# tests/poison/ HOLDS DELIBERATELY BROKEN TREES — fixtures the custody guards are run
# against, not tests. Nothing under it had ever matched `test_*.py`, so nothing was ever
# collected and the question never arose. The M3 fixture for `check_laws` (D0154 item 7) is
# the first whose payload does, and a rehearsal measured the real suite going 842 -> 843,
# the extra node being an assertion-free function that passes for free.
#
# The next payload may not be inert. A poison tree is broken ON PURPOSE, so collecting one
# is a red suite saying nothing about this repo — excluded structurally, once, rather than
# by naming each future payload around pytest.
#
# NOT FIXED BY RENAMING THE PAYLOAD out of `test_*.py`: `check_laws` finds law DEFINITIONS by
# globbing `test_*.py`, so a renamed payload stops being a law file and the fixture's own
# positive control flips from OK to FAIL — measured 2026-09-09, and it would have gone
# unnoticed because the negative case still fails and still prints the marker the custodian
# greps for. The fixture would have kept its green tick while testing a tautology.
#
# The pytest defaults are restated because this key REPLACES them rather than extending them.
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "poison"]

# Import contracts (BRIEF §5.3: no hidden IO; §1/§2: no cross-repo imports).

# Import contracts live in governance/importlinter.toml, NOT here: this file is outside
# the custody set (dependency work must not halt mid-milestone) and the contracts must be
# inside it, because a guard's configuration is part of the guard (D0063, conferral ruling
# 3). Every call site passes `--config governance/importlinter.toml` explicitly.
