# governance/policy.yaml — owner policy as data (BRIEF §9.2; decision D0024).
# Owner-signed at the opening sitting: the owner sets values, then signs the file
# (detached signature governance/policy.yaml.sig, namespace tannen-policy, hardware
# key); scripts/custodian.sh verifies the signature on every run once it exists.
# GUARDS CONSUME THIS FILE. Being asked something answerable from it is a bug —
# file the bug as a decision record citing this file.
version: 0

# Per-milestone spend envelopes (USD). Raising any value above zero is Tier-C door 1
# (affirmative signature). budget.yaml's operational ceilings may never exceed the
# CURRENT milestone's envelope, and scripts/check_manifest.py is what enforces that:
# mechanically, over the checked-in file, at every gate. (That guard compares against the
# maximum envelope over all milestones rather than the current one — D0229 item (5), a
# separate patch in this directory, applied in the same sitting.)
#
# WHAT SPENDGUARD DOES AND DOES NOT DO. Owner ruling of 2026-09-12 (D0240), replacing a
# sentence here that claimed the second half and was false of the SpendGuard that shipped
# at M4. SpendGuard enforces default-deny against THE BUDGET ITS CALLER SUPPLIES. It does
# not read this file and it must not: a library that consults the constitution to decide
# whether a call may be made couples the kernel's spend primitive to this repository's
# governance layout, which BRIEF §10 forbids in every other direction. Supplying a budget
# other than the checked-in budget.yaml is therefore an OWNER act, not a builder act, and
# nothing in the library prevents it. `tannen run` is not a library: it is clamped to the
# checked-in budget.yaml, with any other file requiring an explicit --budget-override
# (D0240 item (2); deferred to M5 Session A by D0241, because a law retiring L4.4's third
# node has no legal home inside M4).
budget_envelopes:
  M0: 0
  M1: 0
  M2: 0
  M3: 0
  M4: 0
  M5: 0

# The licence, settled at the publication sitting. D0176 ruling (2), owner, 2026-09-06:
# Apache-2.0 whole, superseding the MIT/CC-BY-SA-4.0 split these keys used to carry.
# LICENSE and NOTICE at the root are the grant; these keys are still a default and
# still not a publication decision — every byte leaving the boundary is Tier-C door 2.
# No guard reads either key; the owner signature over this file is what makes it hold.
licence_defaults:
  code: Apache-2.0
  docs: Apache-2.0

# External-surface rules (Tier-C door 2). Defaults: nothing leaves.
external_surface:
  # D0115 (owner-signed) and D0176: this repository is published at
  # github.com/gfrmin/tannen and developed in public. `publishing` names THIS repository
  # only — every other byte-leaving act stays a Tier-C door.
  publishing: this-repo-public
  cross_repo_prs: forbidden
  network_writes: captured-oracles-only

# Spot-check sample rate: K decision records sampled into each digest for owner
# review (BRIEF §9.1/§9.2). The digest generator reads this value.
spot_check:
  sample_rate_k: 3

# In-repo mechanics (BRIEF §9.2 reversibility tiers; decisions D0048, D0053). Reversible
# operations on this repo's own history are Tier A: the builder performs them and records
# them, and does NOT ask. Asking about anything in `covers` is itself a defect — file it
# as a decision record citing this file. The failure mode this closes is not laziness but
# its opposite: deference spends owner attention, which is the one resource the autonomy
# protocol exists to conserve.
in_repo_mechanics:
  tier: A
  covers:
    - merging a milestone branch into master once its gate is green
    - creating, deleting or moving worktrees under ~/git/worktrees/tannen/
    - branching, rebasing, fast-forwarding and resetting refs that carry no signature
    - regenerating projections and digests
    - installing or updating dev dependencies already pinned in pyproject.toml
  excludes:
    # NOT in-repo mechanics. Nothing here is relaxed by the list above.
    - creating, moving or deleting any git tag (custody; DELEGATIONS.md, D0049)
    - any edit to a frozen path, to allowed_signers, to tests/poison/, or to a signed
      file (governance/policy.yaml itself included)
    - adding a git remote, or changing the visibility of an existing one
      (Tier-C door external-bytes)

# Citation pins the concept registry must account for (D0115 mechanism (a), D0176).
# NOT derived from concepts/ — see scripts/check_concepts.py. Raise or lower this only
# when a concept record's `sources` list actually changes, and re-sign.
concept_registry:
  expected_citation_pins: 12
