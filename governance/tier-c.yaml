# governance/tier-c.yaml — the closed Tier-C list and the guard-enforced rules
# (BRIEF §9 as amended by §9.1 custody floor and §9.2 reversibility tiers, plus §10
# non-goals). This file is CONSUMED BY THE GUARDS (BRIEF §9: "the list the human reads
# is the list the machine enforces; one source"):
#   - frozen_paths.manifest names the authoritative frozen-paths list; the pre-commit
#     frozen-guard and scripts/check_manifest.py read it.
#   - forbidden_imports must be covered by pyproject.toml's import-linter contracts;
#     scripts/check_manifest.py fails if they drift apart (decision D0016).
#   - budget.file and policy.file name the SpendGuard/policy inputs; check_manifest
#     asserts they exist and that budget ceilings stay within policy envelopes.
# Changing the Tier-C doors below is itself Tier C (door 4/5): owner signature only.
version: 1
source: "BRIEF.md §9 (as amended by §9.1, §9.2) and §10 (non-goals)"

tier_c:
  # The five one-way doors (BRIEF §9.2) — AFFIRMATIVE owner signature only, never
  # silence. Per the non-blocking rule, a door request queues to the next boundary
  # sitting; work continues elsewhere.
  - id: spend-envelopes
    text: "Nonzero or raised spend envelopes (budget.yaml ceilings, policy.yaml budget_envelopes)."
  - id: external-bytes
    text: "Bytes leaving the repo boundary: publishing, PRs to any other constellation repo, network writes outside captured oracles."
  - id: renavon-first-contact
    text: "First contact with Renavon inputs (the M5 gate; mandatory sitting per §9.1)."
  - id: constitution-amendments
    text: "Constitution amendments: BRIEF §3 (principles) or §10 (non-goals)."
  - id: trust-root-changes
    text: "Trust-root changes: scripts/custodian.sh, allowed_signers, tests/poison/, and their MANIFEST.sha256 rows."

guard_enforced:
  # Former Tier-C approvals that are now impossibilities (BRIEF §9.2): the guard, not
  # an approval, prevents them. Changing these RULES is Tier C (doors 4/5 above).
  - id: cross-repo-imports
    guard: "pyproject.toml import-linter contract no-cross-repo (CI + pre-commit lint-imports)"
  - id: frozen-path-edits
    guard: "pre-commit frozen-paths hook + scripts/check_manifest.py (default and --staged modes)"
  - id: store-mutation
    guard: "append-only store; gc prints a refusal (arrives M0; no store exists before then)"
  - id: spend-beyond-envelope
    guard: "SpendGuard default-deny over budget.yaml (arrives M4; ceilings zero until owner signature)"
  - id: kernel-io
    guard: "pyproject.toml import-linter contract kernel-no-io"
  - id: kernel-clock
    guard: "pyproject.toml import-linter contract kernel-no-clock (BRIEF P7; arrived M0 with the kernel)"
  - id: tag-signer-roles
    guard: "scripts/check_tag_signers.py over governance/tag-roles.yaml (D0050/D0054): the
      right principal signed the right class of tag, unknown classes refused, trust root
      pinned by tag-object hash. Arrived at the M0 boundary; custodian invocation and the
      poison fixture are owner-applied (trust-root file)"

non_goals:  # BRIEF §10 verbatim list; changing it is door constitution-amendments
  - "No orchestrator, scheduler, retries, cron."
  - "No distributed execution."
  - "No SQL parsing."
  - "No schema evolution beyond descriptor bump + re-derive."
  - "No UI."
  - "No performance work before M5."
  - "No NULLs."
  - "No store mutation, ever."
  - "No decision layer, utility model, or governor implementation."
  - "No repo unification, in either direction."
  - "No extending proplang."
  - "No dependency on the Renavon monorepo, pkm, credence, or life-agent code."

frozen_paths:
  # The authoritative frozen-paths list is the manifest itself: a path is frozen
  # iff it is listed in this file. Guards read the manifest, not a second list.
  manifest: MANIFEST.sha256

  # ...but a whitelist of hashes is not a seal. The M0-boundary red team showed that a
  # manifest ROW can be deleted (unfreezing the path with no trace: RT-01) and a FILE
  # can be added inside a frozen directory (a tests/laws/m0/conftest.py with an autouse
  # fixture makes a violating implementation pass its own frozen law: RT-03) with
  # `make verify` green end to end. Under a seal both are the same violation: every
  # file under a sealed directory carries a manifest row. Enforced by
  # scripts/check_manifest.py::check_sealed_paths (decision D0056).
  sealed_dirs:
    - tests/laws
    - tests/poison
    - governance/schemas

# The CUSTODY SET (decision D0061). A positive enumeration of the bytes the OWNER
# vouches for by signature, generated into `file` by scripts/gen_custody.py and verified
# by scripts/check_manifest.py::check_custody and by the custodian's own sha256sum pass.
#
# Why this exists as well as MANIFEST.sha256, and why the manifest itself is NOT signed:
# the manifest is builder-maintained and GROWS AT EVERY LAW FREEZE — DELEGATIONS.md
# delegation 1 has the builder freeze each milestone's laws without the owner. An owner
# signature over the manifest would therefore put the owner's key in the path of every
# milestone's Session A, spending the attention the delegation exists to save (BRIEF
# §9.2). The custody set is the stable subset that changes only when the trust root
# changes, so signing it costs one signature per boundary sitting and no more.
#
# It also answers RT-01 in the direction the manifest cannot: a manifest ROW can be
# deleted and the path silently unfreezes, because nothing enumerates what the manifest
# should contain. The custody set IS that enumeration, so deleting a row here is a
# missing pattern, not a silent absence.
#
# COST, stated plainly: any edit to a listed path invalidates the owner signature and
# the gate goes red until the next sitting re-signs. That is the intended property for
# the guards — you cannot weaken the custody floor without the owner noticing — and it
# means guard changes batch to boundary sittings like every other Tier-C act.
# pyproject.toml is deliberately NOT listed: dependency work would otherwise halt
# mid-milestone. The import contracts it used to hold have MOVED to
# governance/importlinter.toml, which IS listed — a guard's configuration is part of the
# guard, and leaving the contracts in the one file the builder could freely edit was the
# resolution half of RT-02 (conferral ruling 3, D0063).
custody:
  file: governance/custody.sha256
  set:
    - BRIEF.md
    - CLAUDE.md
    - DELEGATIONS.md
    - Makefile
    - .pre-commit-config.yaml
    - .github/workflows/ci.yml
    - allowed_signers
    - governance/policy.yaml
    - governance/tier-c.yaml
    - governance/tag-roles.yaml
    - governance/importlinter.toml
    - governance/schemas/*.json
    - scripts/_gov.py
    - scripts/custodian.sh
    - scripts/check_manifest.py
    - scripts/check_concepts.py
    - scripts/check_decisions.py
    - scripts/check_tag_signers.py
    - scripts/check_receipts.py
    - scripts/gen_projections.py
    - scripts/gen_custody.py
    - scripts/opening_sitting.sh
    - scripts/boundary_sitting.sh
    - tests/poison/**/*

# Files whose owner signature is REQUIRED, not merely verified-if-present. RT-04: the
# custodian's policy check reads "if governance/policy.yaml.sig exists, verify it; else
# say 'unsigned (expected before the opening sitting)' and pass" — so DELETING the
# signature lowers the custody floor silently, and the file the guards consume for spend
# envelopes and external-surface rules becomes editable with every guard green. A
# signature that is optional is not a signature. Enforced by
# scripts/check_manifest.py::check_required_signatures (decision D0056).
required_signatures:
  - path: governance/policy.yaml
    namespace: tannen-policy
    signer: owner@tannen
  # MANIFEST.sha256 belongs here too — nothing signs the manifest, so the seal above is
  # only as strong as the builder's honesty (RT-01, RT-14). Adding it requires the owner
  # to sign the manifest first, so it is queued for the boundary sitting rather than
  # landed here, where it would leave the gate red.

forbidden_imports:
  # Modules the kernel package may never import (BRIEF §5.3: the kernel imports no
  # IO modules; oracles/ is the only IO doorway).
  io_modules:
    - io
    - os
    - pathlib
    - socket
    - subprocess
    - shutil
    - tempfile
    - urllib
    - http
    - ftplib
    - asyncio
    - aiohttp
    - requests
    - httpx
    - sqlite3
    - duckdb
  # Sources of nondeterminism the kernel may never import (BRIEF P1 pure core, P7
  # "no hidden clock": now() does not exist in the kernel namespace, and the Clock
  # oracle is the only source of time). Enforced by the kernel-no-clock contract;
  # added at M0 (decision D0042) — this tightens the existing kernel-io rule rather
  # than opening a new door.
  nondeterminism_modules:
    - time
    - datetime
    - calendar
    - zoneinfo
    - random
    - secrets
    - uuid
  # Module names of the constellation repos; forbidden everywhere in tannen
  # (BRIEF §1 standing rule; guard_enforced cross-repo-imports).
  cross_repo:
    - pkm
    - life_agent
    - credence
    - proplang
    - renavon
    - renavon_monorepo

budget:
  file: budget.yaml

policy:
  file: governance/policy.yaml
