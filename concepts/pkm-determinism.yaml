# Concept record — validated against governance/schemas/concept-record.schema.json.
id: pkm-determinism
title: Determinism contract; reproducibility as a declared per-producer property
posture: adopt
grade: L
brief_row: >-
  BRIEF §2: "Determinism contract (semantic equivalence; a cache hit is deterministic
  regardless of producer behaviour on a miss); reproducibility as a declared per-producer
  property (bit / in-distribution / non-reproducible)" — owner pkm SPEC-PRINCIPLES +
  SPEC §7.1. Every oracle declares its reproducibility class; the kernel treats the
  declaration as data. Do not redefine, do not "fix".
notes: >-
  Grade L per BRIEF §2.1's own example (determinism is behaviour-shaped). The
  reproducibility-class enum will surface as a field of tannen's oracle descriptors —
  a Grade-S artifact tannen owns — but the contract itself is pkm's and is enforced
  here by law L1 (replay determinism) once M0 freezes it (decision D0009).
