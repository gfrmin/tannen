title: Frozen-oracle build protocol (tests frozen + manifest signed before implementation; key custody; delegation in tag messages)
posture: adopt
grade: P
brief_row: >-
  BRIEF §2: "Frozen-oracle build protocol (tests frozen + manifest signed before
  implementation; author/builder key custody; delegation recorded in tag messages)" —
  owner proplang WRITEUP.md / CLAUDE.md. Adopt as process (BRIEF §8), with standing
  delegation to minimise owner touchpoints (BRIEF §9).
notes: >-
  Process/judgment-shaped: its executable form here is this repo's own machinery —
  MANIFEST.sha256 + scripts/check_manifest.py + the pre-commit frozen-paths guard +
  DELEGATIONS.md + allowed_signers — which adopts the protocol rather than testing the
  owner's statement of it. The review_marker cites the owner; the machinery enforces the
  practice per milestone (CLAUDE.md build protocol).
