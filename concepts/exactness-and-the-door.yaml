id: exactness-and-the-door
title: Exactness at the decision layer; the door; the world supplies every constant
posture: adopt
grade: L
brief_row: >-
  BRIEF §2: "Exactness at the decision layer (Rational, no floats, no tolerances); the
  door (declared namespace covered exactly or refused by name; no silent defaults); the
  world supplies every constant" — owner proplang KERNEL.md. Kernel keys refuse floats by
  default (BRIEF §5.8); anything crossing toward a decision layer is exact or explicitly
  declared lossy.
notes: >-
  Behaviour-shaped in tannen's adoption: the disciplines land as mechanically checkable
  properties of the canonical encoding and key admission (bare floats rejected;
  Lossy(f, grid) the explicit, priced door; refusal-by-name over silent defaults). The
  M0/M1 property suites are the treaty artifact; until then the pin is the vendored
  KERNEL.md page (decision D0009).
