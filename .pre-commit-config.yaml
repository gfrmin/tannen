# Pre-commit guards (BRIEF §9: the list the human reads is the list the machine
# enforces). Order matters: frozen-path rejection first, then projection freshness
# (the hook regenerates; a mutated file fails the hook so the regeneration gets
# staged and reviewed), then the full checks.
repos:
  - repo: local
    hooks:
      - id: frozen-paths
        name: reject edits to frozen paths (MANIFEST.sha256)
        entry: uv run python scripts/check_manifest.py --staged
        language: system
        pass_filenames: false
        always_run: true
      - id: regen-projections
        name: regenerate stale projections (CONCEPTS.md, DECISIONS.md)
        entry: uv run python scripts/gen_projections.py
        language: system
        pass_filenames: false
        always_run: true
      - id: check-concepts
        name: concept records ↔ vendored artifacts complete
        entry: uv run python scripts/check_concepts.py
        language: system
        pass_filenames: false
        always_run: true
      - id: check-decisions
        name: decision records valid; bindings resolve
        entry: env -u TANNEN_CHECK_DECISIONS_NESTED uv run python scripts/check_decisions.py
        language: system
        pass_filenames: false
        always_run: true
      - id: lint-imports
        name: kernel has no IO; no cross-repo imports
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        always_run: true
