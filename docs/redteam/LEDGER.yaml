# docs/redteam/LEDGER.yaml — where every red-team finding stands (RT-M4-07, D0246 A3).
#
# WHAT THIS IS. One row per finding id that appears in any docs/redteam/*.md report, saying
# where it stands: closed (by which record), scheduled (where, under which record), deferred
# (why, and at which boundary it is looked at again), or a non-goal (which BRIEF clause).
# RT-M4-07 found that the queue had no service-rate: infrastructure findings sat "unchanged"
# across four boundaries and nothing required a sitting to account for them. The M4 boundary
# sitting's driver refuses to close while any finding lacks a valid row here
# (docs/proposals/2026-09-11-m4-boundary-sitting/ledger_gate.py).
#
# WHO MAINTAINS IT. The builder drafts and updates rows; the owner confirms them at each
# boundary sitting. A `deferred` row is a proposal until the owner has seen it at a sitting.
# This file is not custody-set and not in `make verify` — promoting the gate is a later
# ruling (D0249).
#
# WHAT IT IS NOT. It is a disposition record, not a guard's enumeration: the set of ids is
# DERIVED from the reports' own `## RT-… —` headings and `| RT-… |` table rows, and the gate
# refuses both a finding with no row and a row naming no finding. Nothing here decides what
# is checked; it records what was decided about each finding.
#
# SCHEMA. id, report, severity (as the report states it), disposition, and by disposition:
#   closed    -> record  (the decision that closed it)
#   scheduled -> where + record
#   deferred  -> reason + revisit
#   non-goal  -> cite    (BRIEF §…)
# plus an optional note. Status audits (RT-M1-06, RT-M2-08, RT-M3-06, RT-M4-06) are
# informational: they are "closed" by the record that filed their pass, and every item they
# carry is dispositioned under its own id.
#
# Evidence for every row: each report's own text and the status audits RT-M1-06 (at M1),
# RT-M2-08, RT-M3-06 and RT-M4-06 (the latest, at 3cac685), plus
# docs/proposals/2026-09-11-m4-boundary-sitting/2026-09-12-red-team-findings.md.
